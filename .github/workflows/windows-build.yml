name: Build Windows EXE
'on':
  workflow_dispatch: {}
  push: {}
permissions:
  contents: read
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-single-exe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Build and verify standalone Windows EXE
        run: python3 tools/build_windows.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: active-code-v5.1.8-win64-libvlc-stable-offline
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
  windows-runtime-check:
    needs: windows-single-exe
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify independent runtime input
        run: python tools/verify_runtime.py
      - name: Run native Windows and VLC tests
        working-directory: source
        shell: pwsh
        run: |
          go test -count=1 -v ./... 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/windows-native-tests.txt"
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
      - name: Save native Windows test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-native-test-log
          path: windows-native-tests.txt
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/download-artifact@v8.0.2
        with:
          name: active-code-v5.1.8-win64-libvlc-stable-offline
          path: artifacts
      - name: Check built GUI stays running at startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/artifacts/active-code.exe" -ArgumentList "--portable" -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Windows GUI exited during startup: $($process.ExitCode)"
            }
            Write-Host 'PASS: packaged Windows GUI stayed running at startup'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
  publish-windows-release:
    needs: [windows-single-exe, windows-runtime-check]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: active-code-v5.1.8-win64-libvlc-stable-offline
          path: artifacts
      - name: Verify release asset checksum
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish successful Windows build to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "from pathlib import Path; print(Path('app-version.txt').read_text(encoding='utf-8-sig').strip())")"
          tag="windows-v${version}-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-is-draft.txt 2>/dev/null; then
            if [ "$(cat release-is-draft.txt)" = 'false' ]; then
              echo "Release already published for this run; keeping existing assets."
              gh release view "$tag" --json url --jq '.url'
              exit 0
            fi
            gh release upload "$tag" artifacts/active-code.exe artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" artifacts/active-code.exe artifacts/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "active-code Windows v${version} - Build ${GITHUB_RUN_NUMBER}" \
              --notes "Standalone Windows x64 EXE with embedded VLC 3.0.24 Stable. Source version ${version}. Build and native Windows checks passed. Download active-code.exe under Assets." \
              --draft
          fi
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json url --jq '.url'
